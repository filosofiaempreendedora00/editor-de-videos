<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- BANDEIRA TREMULANDO (Jung: "tocava música francesa… música alemã"), profissional e discreta: uma bandeira de tecido
     de verdade (ondas que andam do mastro para a ponta, sombra nas dobras, presa num mastro dourado fino) entra
     desenrolando no canto de cima do ativo e fica tremulando; embaixo, o nome do país em versalete creme.
     Desenhada quadro a quadro em canvas (window.__seek) — igual na prévia e na exportação.
     params.flag: "franca" | "alemanha" | "italia"; params.label; params.x, params.y (0..1, canto do mastro); params.w (largura vmin). -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
:root { --gold: #E0BB6A; --cream: #F5EFE6; }
body { font-family: MA, "Helvetica Neue", sans-serif; }
.stage { display: block; }
#wrap { position: absolute; left: var(--x); top: var(--y); opacity: 0; transform: translateY(-2vmin); animation: inn .6s .05s cubic-bezier(.16,1,.3,1) forwards; }
canvas { display: block; filter: drop-shadow(0 1.2vmin 2vmin rgba(0,0,0,.45)); }
.lab { margin-top: 1.2vmin; color: var(--cream); font-weight: 600; font-size: 3.6vmin; letter-spacing: .3em; text-transform: uppercase;
       text-shadow: 0 .3vmin 1.2vmin rgba(0,0,0,.8); opacity: 0; animation: fade .6s .7s ease-out forwards; padding-left: 3vmin; }
@keyframes inn { to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div id="wrap"><canvas id="c"></canvas><div class="lab" id="lab"></div></div></div>
<script>
const FLAGS = {
  franca: { dir: 'v', cores: ['#1F4FA0', '#F2EEE6', '#D9413A'] },
  alemanha: { dir: 'h', cores: ['#1A1715', '#C8312B', '#E8B53A'] },
  italia: { dir: 'v', cores: ['#2E8B57', '#F2EEE6', '#C8312B'] },
};
const F = FLAGS[P.flag] || FLAGS.franca;
const r = document.documentElement.style;
r.setProperty('--x', ((+P.x || 0.06) * 100) + '%'); r.setProperty('--y', ((+P.y || 0.05) * 100) + '%');
document.getElementById('lab').textContent = P.label || '';
const vmin = Math.min(innerWidth, innerHeight) / 100;
const FW = (+P.w || 30) * vmin, FH = FW * 0.64, POLE = 0.9 * vmin, PAD = 0.12 * FH;
const cv = document.getElementById('c'), dpr = 2;
cv.width = (FW + POLE + 8) * dpr; cv.height = (FH + 2 * PAD + 1.2 * FH * 0.4) * dpr;
cv.style.width = (FW + POLE + 8) + 'px'; cv.style.height = (FH + 2 * PAD + 1.2 * FH * 0.4) + 'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);
function paint(t) {
  g.clearRect(0, 0, cv.width, cv.height);
  // mastro dourado fino
  g.fillStyle = '#C9A55E'; g.fillRect(0, 0, POLE, FH * 1.55);
  g.fillStyle = '#E0BB6A'; g.beginPath(); g.arc(POLE / 2, POLE * 0.6, POLE * 0.9, 0, 7); g.fill();
  const unf = Math.max(0, Math.min(1, (t - 0.15) / 0.8));          // desenrola na entrada
  const ue = 1 - Math.pow(1 - unf, 3);
  const W = FW * ue, N = 48, A = FH * 0.06, k = 2 * Math.PI / (FW * 0.75), w = 4.2;
  for (let i = 0; i < N; i++) {
    const x0 = i / N * W, x1 = (i + 1) / N * W, xm = (x0 + x1) / 2;
    const amp = A * Math.min(1, xm / (FW * 0.25));                   // preso no mastro: a onda cresce para a ponta
    const yo = amp * Math.sin(k * xm - w * t);
    const slope = amp * k * Math.cos(k * xm - w * t);                 // inclinação → luz/sombra da dobra
    const shade = Math.max(-0.28, Math.min(0.22, -slope * 0.9));
    const top = PAD + yo, h = FH;
    const draw = (col, y, hh) => { g.fillStyle = col; g.fillRect(POLE + x0, y, x1 - x0 + 0.8, hh); };
    if (F.dir === 'v') {
      const ci = Math.min(2, Math.floor(xm / (FW / 3)));
      draw(F.cores[ci], top, h);
    } else {
      for (let j = 0; j < 3; j++) draw(F.cores[j], top + j * h / 3, h / 3 + 0.6);
    }
    g.fillStyle = shade > 0 ? `rgba(255,255,255,${shade * 0.55})` : `rgba(0,0,0,${-shade})`;
    g.fillRect(POLE + x0, top, x1 - x0 + 0.8, h);
  }
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

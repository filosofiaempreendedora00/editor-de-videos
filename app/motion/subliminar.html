<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- SUBLIMINAR v2 (Jung: "esteticamente horrenda… todo espaçado, centralizado e porco… e tampando minha cara"): bloco
     COMPACTO alinhado à esquerda, num painel sépia (contraste), embaixo do rosto. "percebe" entra nítido; "sem nem
     perceber" passa fininha e meio apagada, como um sussurro (legível, mas o olho quase não registra); "que ele
     PERCEBEU." fecha grande em dourado, saindo do desfoque. Linhas coladas, nada de espaçamento largo.
     params.lines = [{text, kind: "a"|"sub"|"key", t}], params.top -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; --sepia: rgba(46,32,23,.82); }
body { font-family: MA, "Helvetica Neue", sans-serif; }
.stage { display: block; }
.panel { position: absolute; left: 7%; top: var(--top); padding: 3vmin 5vmin 3.4vmin 4.6vmin; background: var(--sepia);
         border-left: .5vmin solid var(--gold); border-radius: .8vmin; box-shadow: 0 2vmin 5vmin rgba(0,0,0,.45);
         opacity: 0; transform: translateX(-4vmin); animation: inn .5s .02s cubic-bezier(.16,1,.3,1) forwards; }
.l { display: block; white-space: nowrap; opacity: 0; line-height: 1.08; }
.a { color: var(--cream); font-weight: 600; font-size: 7.4vmin; letter-spacing: -.01em; }
.sub { color: var(--sand); font-weight: 600; font-size: 5.2vmin; letter-spacing: 0; margin: .4vmin 0 .6vmin; font-style: italic; }
.key { font-weight: 700; font-size: 11vmin; color: var(--gold); letter-spacing: -.01em; }
.key b { color: var(--cream); font-weight: 600; font-size: .52em; letter-spacing: 0; margin-right: .25em; }
@keyframes inn { to { opacity: 1; transform: none; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="panel" id="b"></div></div>
<script>
const topPct = Math.min(74, Math.max(60, +(P.top || 64)));
document.documentElement.style.setProperty('--top', topPct + '%');
const lines = P.lines || [];
const b = document.getElementById('b');
b.innerHTML = lines.map((l, k) => {
  if (l.kind === 'key') {
    const m = String(l.text).match(/^(.*?)(\S+[.!?]?)$/);
    return `<span class="l key" id="l${k}">${m && m[1] ? `<b>${esc(m[1].trim())}</b>` : ''}${esc(m ? m[2] : l.text).toUpperCase()}</span>`;
  }
  return `<span class="l ${l.kind === 'sub' ? 'sub' : 'a'}" id="l${k}">${esc(l.text)}</span>`;
}).join('');
const ease = x => 1 - Math.pow(1 - x, 3);
function paint(t) {
  lines.forEach((l, k) => {
    const el = document.getElementById('l' + k), t0 = +l.t || 0, x = Math.max(0, Math.min(1, (t - t0) / 0.45)), e = ease(x);
    if (l.kind === 'sub') {                      // sussurro: aparece fraco e respira de leve
      el.style.opacity = (e * (0.5 + 0.08 * Math.sin((t - t0) * 9))).toFixed(3);
      el.style.filter = `blur(${(0.18 + (1 - e) * 0.5).toFixed(2)}vmin)`;
    } else if (l.kind === 'key') {
      el.style.opacity = e.toFixed(3);
      el.style.filter = `blur(${((1 - e) * 1.4).toFixed(2)}vmin)`;
      el.style.transform = `translateY(${((1 - e) * 1.5).toFixed(2)}vmin)`;
    } else {
      el.style.opacity = e.toFixed(3);
      el.style.transform = `translateY(${((1 - e) * 1.5).toFixed(2)}vmin)`;
    }
  });
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

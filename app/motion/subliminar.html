<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- SUBLIMINAR (Jung: "percebe sem nem perceber que ele percebeu" — "genial demais pra legenda padrão"), tipografia
     cinética que FAZ o que a frase diz: "percebe" entra nítido; "sem nem perceber" passa quase invisível (desfocada,
     tremeluzindo baixinho, como algo que o olho não registra); "que ele PERCEBEU." nasce do desfoque para o foco,
     enorme, em dourado. Faixa escura embaixo para contraste. params.lines = [{text, kind: "a"|"sub"|"key", t}], params.top -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; }
body { font-family: MA, "Helvetica Neue", sans-serif; }
.stage { display: block; }
.band { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--top) - 5%); opacity: 0;
        background: linear-gradient(180deg, rgba(21,12,6,0) 0%, rgba(21,12,6,.68) 24%, rgba(21,12,6,.84) 100%);
        animation: fade .4s ease-out forwards; }
.blk { position: absolute; left: 4%; right: 4%; top: var(--top); text-align: center; }
.l { display: block; white-space: nowrap; opacity: 0; }
.a { color: var(--cream); font-weight: 600; font-size: 7vmin; letter-spacing: .02em; text-shadow: 0 .5vmin 1.8vmin rgba(0,0,0,.7); }
.sub { color: var(--sand); font-weight: 600; font-size: 6vmin; letter-spacing: .14em; margin: 1vmin 0; }
.key { font-weight: 700; font-size: 12vmin; line-height: 1.05; color: var(--gold); letter-spacing: .01em; }
.key b { color: var(--cream); font-weight: 600; font-size: .5em; letter-spacing: .02em; display: block; margin-bottom: .6vmin; }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="band"></div><div class="blk" id="b"></div></div>
<script>
const topPct = Math.min(72, Math.max(58, +(P.top || 64)));
document.documentElement.style.setProperty('--top', topPct + '%');
const lines = P.lines || [];
const b = document.getElementById('b');
b.innerHTML = lines.map((l, k) => {
  if (l.kind === 'key') {
    const m = String(l.text).match(/^(.*?)(\S+[.!?]?)$/);
    return `<span class="l key" id="l${k}">${m && m[1] ? `<b>${esc(m[1].trim())}</b>` : ''}${esc(m ? m[2] : l.text).toUpperCase()}</span>`;
  }
  return `<span class="l ${l.kind === 'sub' ? 'sub' : 'a'}" id="l${k}">${esc(l.text)}</span>`;
}).join('');
const ease = x => 1 - Math.pow(1 - x, 3);
function paint(t) {
  lines.forEach((l, k) => {
    const el = document.getElementById('l' + k), t0 = +l.t || 0, x = Math.max(0, Math.min(1, (t - t0) / 0.55)), e = ease(x);
    if (l.kind === 'sub') {
      // quase invisível: some e volta baixinho (o olho não registra), sempre desfocada
      const fl = 0.22 + 0.1 * Math.sin((t - t0) * 23) * Math.sin((t - t0) * 7);
      el.style.opacity = (x > 0 ? Math.min(fl, e * 0.32) : 0).toFixed(3);
      el.style.filter = `blur(${(0.55 + 0.15 * Math.sin((t - t0) * 11)).toFixed(2)}vmin)`;
      el.style.transform = `translateY(${(1 - e) * 1.4}vmin)`;
    } else if (l.kind === 'key') {
      el.style.opacity = e.toFixed(3);
      el.style.filter = `blur(${((1 - e) * 1.6).toFixed(2)}vmin) drop-shadow(0 .6vmin 1.6vmin rgba(0,0,0,.6))`;
      el.style.transform = `scale(${(0.94 + 0.06 * e + 0.015 * Math.max(0, t - t0 - 0.6)).toFixed(4)})`;
    } else {
      el.style.opacity = e.toFixed(3);
      el.style.filter = `blur(${((1 - e) * 0.8).toFixed(2)}vmin)`;
      el.style.transform = `translateY(${(1 - e) * 1.8}vmin)`;
    }
  });
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

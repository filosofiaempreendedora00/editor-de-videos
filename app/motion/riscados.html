<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- ITENS RISCADOS / COPIADOS, editorial Kronos, v3 (Joshie 20/10: "estética e efeito sonoro excessivamente IA… só
     parte da palavra era riscada… bullets mais claros e riscados um por um de forma mais elegante"): uma LISTA limpa,
     cada item numa linha só, com um ponto dourado na frente; o item entra quando é falado e, logo depois, um fio fino
     e RETO atravessa o texto inteiro (da primeira à última letra) e o item apaga para a metade. Os riscados ficam na
     lista (dá para ler o que foi descartado). Sem som de risco (o clique de cada item vem do plano).
     params.items = [{text, t, ts?}]; mode "copiar": cópia fantasma deslizando para o lado. params.top -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
:root { --ease: cubic-bezier(.16, 1, .3, 1); --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; }
body { font-family: MA, "Helvetica Neue", sans-serif; }
.veil { position: absolute; inset: 0; opacity: 0;
        background: linear-gradient(180deg, rgba(21,12,6,0) 42%, rgba(21,12,6,.62) 62%, rgba(21,12,6,.8) 100%);
        animation: fadeIn .6s ease-out both; }
.items { position: absolute; left: 0; right: 0; top: 62%; display: flex; flex-direction: column; align-items: center; gap: 2.2vmin; }
.row { display: flex; align-items: center; gap: 2.6vmin; opacity: 0; transform: translateY(1.6vmin); filter: blur(.6vmin);
       animation: inn .6s var(--t) var(--ease) forwards; }
.dot { width: 1.5vmin; height: 1.5vmin; border-radius: 50%; background: var(--gold); flex: none; }
.it { position: relative; white-space: nowrap; color: var(--cream); font-weight: 600; font-size: var(--fs); letter-spacing: .02em;
      text-shadow: 0 .4vmin 1.6vmin rgba(21,12,6,.8); }
.riscar .it { animation: dim .45s calc(var(--ts) + .25s) ease-out forwards; }
.riscar .it::after { content: ""; position: absolute; left: -1%; right: -1%; top: 54%; height: .32vmin; background: var(--cream);
                     transform: scaleX(0); transform-origin: left center; box-shadow: 0 0 .6vmin rgba(21,12,6,.6);
                     animation: strike .42s var(--ts) cubic-bezier(.65, 0, .35, 1) forwards; }
.riscar .row .dot { animation: dotdim .45s calc(var(--ts) + .25s) ease-out forwards; }
.ghost { position: absolute; inset: 0; color: var(--gold); opacity: 0; animation: ghost 1.1s calc(var(--t) + .35s) var(--ease) forwards; }
@keyframes inn { to { opacity: 1; transform: none; filter: none; } }
@keyframes strike { to { transform: scaleX(1); } }
@keyframes dim { to { opacity: .45; } }
@keyframes dotdim { to { background: var(--sand); } }
@keyframes ghost { 0% { opacity: .0; transform: none; } 25% { opacity: .7; } 100% { opacity: .0; transform: translateX(14vmin); filter: blur(.3vmin); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="veil"></div>
  <div class="items" id="items"></div>
</div>
<script>
const items = (P.items || []).map((it, k, a) => {
  const t = +it.t || 0, nx = a[k + 1] ? +a[k + 1].t : null;
  // o risco vem logo depois do item falado, sempre antes do próximo entrar
  const ts = it.ts != null ? +it.ts : (nx != null ? Math.max(t + 0.45, nx - 0.3) : t + 0.6);
  return { ...it, t, ts };
});
const riscar = P.mode !== 'copiar';
const box = document.getElementById('items');
box.className = 'items ' + (riscar ? 'riscar' : 'copiar');
const topPct = P.top ? Math.max(60, Math.min(74, +P.top)) : 62;
box.style.top = topPct + '%';
// letra: o item mais comprido cabe numa linha (~84% da largura) e o bloco cabe até ~90% da altura
const longest = Math.max(6, ...items.map(i => String(i.text || '').length));
const perLine = (90 - topPct) * 1.78 / Math.max(1, items.length) - 2.2;
const fs = Math.max(4.4, Math.min(7, 80 / (longest * 0.62), perLine / 1.25));
box.innerHTML = items.map(it => `<div class="row" style="--t:${it.t.toFixed(2)}s;--ts:${it.ts.toFixed(2)}s">` +
  `<span class="dot"></span><span class="it" style="--fs:${fs.toFixed(2)}vmin;--ts:${it.ts.toFixed(2)}s">${esc(it.text)}` +
  (riscar ? '' : `<span class="ghost">${esc(it.text)}</span>`) + '</span></div>').join('');
</script></body></html>

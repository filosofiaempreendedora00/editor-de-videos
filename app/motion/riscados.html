<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- ITENS RISCADOS / COPIADOS, editorial Kronos, v2 (Joshie 19/10: "pouco profissional… queria efeito mais irado e com
     sons em cada item riscado"): cada item SOBE de uma máscara, grande, no momento em que é falado
     (params.items = [{text, t, ts?}]); mode "riscar" (padrão): um traço de MARCADOR dourado, à mão (levemente torto,
     com uma segunda passada fina), risca o item em ~0,3 s (em `ts`, ou logo depois de entrar) e o item apaga e encolhe
     — o som de cada risco vem do plano (sfx na mesma palavra). mode "copiar": de cada item sai uma cópia fantasma
     deslizando para o lado ("pode copiar o preço, o produto…"). -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --ease: cubic-bezier(.16, 1, .3, 1); --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; }
body { font-family: MA, "Helvetica Neue", sans-serif; }
.veil { position: absolute; inset: 0; opacity: 0;
        background: linear-gradient(180deg, rgba(21,12,6,0) 40%, rgba(21,12,6,.6) 62%, rgba(21,12,6,.8) 100%);
        animation: fadeIn .6s ease-out both; }
.items { position: absolute; left: 3%; right: 3%; top: 62%; height: 30vmin; }
.row { position: absolute; left: 0; right: 0; top: 0; text-align: center; overflow: hidden; padding: .6vmin 2vmin 1.4vmin; }
/* um item por vez: quando o próximo entra, o anterior (já riscado) sobe e some */
.row.out { animation: away .45s var(--tn) cubic-bezier(.5, 0, .75, 0) forwards; }
@keyframes away { to { transform: translateY(-70%); opacity: 0; } }
.it { position: relative; display: inline-block; font-size: var(--fs, 7vmin); font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      color: var(--cream); text-shadow: 0 .4vmin 1.6vmin rgba(21,12,6,.85); transform: translateY(110%);
      animation: rise .6s var(--t) var(--ease) forwards; }
.riscar .it { animation: rise .6s var(--t) var(--ease) forwards, done .5s calc(var(--ts) + .3s) ease-out forwards; }
.it svg { position: absolute; left: -4%; top: 0; width: 108%; height: 100%; overflow: visible; pointer-events: none; }
.it path { fill: none; stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; vector-effect: non-scaling-stroke;
           filter: drop-shadow(0 .3vmin .6vmin rgba(21,12,6,.7)); }
.it path.a { stroke-width: 1.3vmin; animation: draw .32s var(--ts) cubic-bezier(.5, 0, .2, 1) forwards; }
.it path.b { stroke-width: .5vmin; opacity: .8; animation: draw .26s calc(var(--ts) + .12s) cubic-bezier(.5, 0, .2, 1) forwards; }
.ghost { position: absolute; inset: 0; color: var(--gold); opacity: 0; animation: ghost 1.1s calc(var(--t) + .35s) var(--ease) forwards; }
@keyframes rise { to { transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes done { to { opacity: .55; } }
@keyframes ghost { 0% { opacity: .0; transform: none; } 25% { opacity: .7; } 100% { opacity: .0; transform: translateX(14vmin); filter: blur(.3vmin); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="veil"></div>
  <div class="items" id="items"></div>
</div>
<script>
const items = (P.items || []).map((it, k, a) => {
  const t = +it.t || 0, nx = a[k + 1] ? +a[k + 1].t : null;
  // o risco cai em `ts` (fim do item falado) ou logo depois de ele entrar, nunca depois do próximo
  const ts = it.ts != null ? +it.ts : Math.min(t + 0.75, nx != null ? Math.max(t + 0.4, nx - 0.15) : t + 0.75);
  return { ...it, t, ts };
});
const box = document.getElementById('items');
const riscar = P.mode !== 'copiar';
box.className = 'items ' + (riscar ? 'riscar' : 'copiar');
const longest = Math.max(4, ...items.map(i => String(i.text || '').length));
const topPct = P.top ? Math.max(60, Math.min(76, +P.top)) : 62;
// cabe tudo entre o queixo (P.top) e ~91% da altura (1% da altura = 1,78 vmin na tela 9:16)
const fs = Math.min(9.5, 86 / (longest * 0.7));      // um item por vez: grande
// traço de marcador: levemente torto e diferente em cada item (parece feito à mão)
const stroke = k => {
  const y1 = 52 + (k % 2 ? -4 : 3), y2 = 50 + (k % 2 ? 5 : -4);
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="a" pathLength="100" d="M1 ${y1} C 30 ${y1 - 3}, 65 ${y2 + 4}, 99 ${y2}"/>` +
         `<path class="b" pathLength="100" d="M6 ${y1 + 7} C 40 ${y1 + 3}, 70 ${y2 + 8}, 96 ${y2 + 5}"/></svg>`;
};
box.innerHTML = items.map((it, k) => `<div class="row${items[k + 1] ? ' out' : ''}" style="--tn:${items[k + 1] ? (items[k + 1].t - 0.05).toFixed(2) : 99}s"><div class="it" style="--t:${it.t.toFixed(2)}s;--ts:${it.ts.toFixed(2)}s;--fs:${fs.toFixed(2)}vmin">` +
  `${esc(it.text)}` + (riscar ? stroke(k) : `<span class="ghost">${esc(it.text)}</span>`) + '</div></div>').join('');
box.style.top = topPct + '%';
</script></body></html>

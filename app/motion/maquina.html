<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- MÁQUINA DE ESCREVER (Jung: "lettering muito mais chamativo, estilo máquina de escrever, com o barulho"): uma tira de
     papel creme desliza para dentro e o texto é DATILOGRAFADO letra por letra (American Typewriter, tinta sépia, cada
     letra cai com um tremidinho de tecla), com o cursor piscando; a palavra-chave sai na tinta de destaque.
     v2 (Jung 22/10: "ser escrito enquanto eu falo e não aparecer pronto… 'sem nem perceber' muito apagado… hierarquia
     ruim"): várias LINHAS, cada uma começa a ser digitada quando é falada e termina antes da próxima.
     params.text + params.key (uma linha) ou params.lines = [{text, style: "n"|"sub"|"key", key}] com params.items =
     [{kind: "line", t}] (um por linha, na ordem) e, opcional, {kind: "end", t} (onde a digitação de uma linha termina).
     O tempo de cada letra segue typing_times() — a MESMA conta do som de teclas (sfx.make_typing, montar_roteiro). -->
<style>
:root { --ink: #2B1C12; --gold: #A8661F; --paper: #F3ECDF; }
.stage { display: block; }
.paper { position: absolute; left: 50%; top: var(--top); width: 88vmin; transform: translate(-50%, 6vmin) rotate(-1.2deg); opacity: 0;
         padding: 4.2vmin 5vmin 4.6vmin 6.4vmin; background:
           repeating-linear-gradient(180deg, rgba(43,28,18,0) 0 6.2vmin, rgba(43,28,18,.06) 6.2vmin 6.35vmin), var(--paper);
         border-radius: .6vmin; box-shadow: 0 2.4vmin 6vmin rgba(0,0,0,.55); animation: inn .55s .05s cubic-bezier(.16,1,.3,1) forwards; }
.paper::before { content: ""; position: absolute; left: 3vmin; top: 0; bottom: 0; width: .25vmin; background: rgba(200,80,60,.35); }
.txt { font-family: "American Typewriter", "Courier New", Courier, monospace; font-size: var(--fs); line-height: 1.22; color: var(--ink);
       font-weight: 600; letter-spacing: .01em; min-height: 1.22em; }
.txt.sub { font-style: italic; font-weight: 500; color: #4A3726; font-size: calc(var(--fs) * .86); margin: .25em 0 .1em; }
.txt.key { margin-top: .15em; }
.wd { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; white-space: pre; opacity: 0; }
.ch.k { color: var(--gold); }
.txt.key .ch.k { font-size: 1.55em; font-weight: 700; letter-spacing: .02em; }
.cur { display: inline-block; width: .55em; height: .12em; background: var(--ink); vertical-align: -.1em; margin-left: .05em; }
@keyframes inn { to { opacity: 1; transform: translate(-50%, 0) rotate(-1.2deg); } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="paper" id="pp"></div></div>
<script>
const items = P.items || [];
const lineT = items.filter(i => i.kind === 'line').map(i => +i.t);
const endT = items.find(i => i.kind === 'end')?.t;
const dur = +P.dur || 3;
const lines = (P.lines && P.lines.length ? P.lines : [{ text: P.text || '', style: 'n', key: P.key }])
  .map((l, k) => ({ ...l, text: String(l.text || ''), t: lineT[k] ?? (k === 0 ? +(P.t0 ?? 0.25) : null) }));
// tempo de cada linha: começa quando é falada e termina antes da próxima (ou no "end", ou perto do fim do motion)
lines.forEach((l, k) => {
  if (l.t == null) l.t = lines[k - 1].t + lines[k - 1].text.length / 18;
  const nx = lines[k + 1]?.t ?? (endT != null && k === lines.length - 1 ? endT : dur - 0.3);
  const span = Math.max(0.4, (nx - l.t) * 0.85);
  l.cps = P.cps && !P.lines && endT == null ? +P.cps : Math.max(12, Math.min(40, l.text.length / span));
});
const longest = Math.max(...lines.map(l => l.text.length));
const r = document.documentElement.style;
r.setProperty('--top', Math.min(74, Math.max(60, +(P.top || 66))) + '%');
r.setProperty('--fs', (lines.length > 1 ? 6.6 : longest > 40 ? 6.4 : 8) + 'vmin');
const pp = document.getElementById('pp');
const all = [];       // [{el, t}] cada letra com o instante em que cai
lines.forEach(l => {
  const div = document.createElement('div');
  div.className = 'txt' + (l.style === 'sub' ? ' sub' : l.style === 'key' ? ' key' : '');
  const key = String(l.key || '').toLowerCase(), ks = key ? l.text.toLowerCase().indexOf(key) : -1;
  let html = '', i = 0;
  for (const part of l.text.split(/(\s+)/)) {        // letras agrupadas por PALAVRA (a linha só quebra entre palavras)
    const cs = [...part].map(c => { const k = ks >= 0 && i >= ks && i < ks + key.length;
      return `<span class="ch${k ? ' k' : ''}" data-t="${(l.t + i++ / l.cps).toFixed(4)}">${esc(c)}</span>`; }).join('');
    html += /^\s+$/.test(part) ? cs : `<span class="wd">${cs}</span>`;
  }
  div.innerHTML = html;
  pp.appendChild(div);
});
pp.lastChild && pp.lastChild.insertAdjacentHTML('beforeend', '<span class="cur" id="cur"></span>');
const chars = [...pp.querySelectorAll('.ch')].map(el => ({ el, t: +el.dataset.t }));
const rnd = s => { const x = Math.sin(s * 91.7) * 43758.5; return x - Math.floor(x); };
const cur = document.getElementById('cur');
function paint(t) {
  let last = null;
  chars.forEach((c, i) => {
    const a = Math.max(0, Math.min(1, (t - c.t) * 50));              // cada letra "cai" em ~1/50 s
    c.el.style.opacity = a > 0 ? (0.86 + rnd(i) * 0.14).toFixed(3) : '0';
    const dy = a > 0 && a < 1 ? (1 - a) * -0.12 : (rnd(i + 3) - 0.5) * 0.04;   // tremidinho da tecla + desalinho leve
    c.el.style.transform = `translateY(${dy.toFixed(3)}em) rotate(${((rnd(i + 7) - .5) * 1.6).toFixed(2)}deg)`;
    if (a > 0) last = c.el;
  });
  if (cur) {
    if (last) last.after(cur);
    const done = !chars.length || t >= chars[chars.length - 1].t;
    cur.style.opacity = done ? (Math.floor(t * 2.4) % 2 ? 0 : 1) : 1;
  }
}
// NA DIVISA (params.seam): a tira de papel se apoia na divisa da tela dividida, no lugar da legenda — fora do rosto
function seamFit() {
  if (!P.seam) return;
  const p = document.querySelector('.paper'), h = p.getBoundingClientRect().height / (innerHeight || 1920) * 100;
  if (h > 0) p.style.top = (+P.seam + 2 - h) + '%';
}
// instantes de cada letra (para o som de teclas, fora do navegador): window.__typing()
window.__typing = () => chars.filter(c => c.el.textContent.trim()).map(c => c.t);
const seek0 = window.__seek;
window.__seek = t => { seek0(t); seamFit(); paint(t); };
paint(0);
</script></body></html>

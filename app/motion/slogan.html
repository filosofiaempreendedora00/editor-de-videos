<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- SLOGAN NA LATA ("Murder your thirst"): a foto do produto ocupa a tela (params.files[0]) aproximando devagar; o
     slogan (params.text) se IMPRIME no produto letra a letra a partir de params.t_text; a tradução (params.sub)
     entra embaixo em dourado em params.t_sub. Sóbrio, Kronos; legenda comum escondida (hide_captions). -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
:root { --ease: cubic-bezier(.22, 1, .36, 1); --gold: #E0BB6A; --cream: #F5EFE6; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: #150C06; }
.bg { position: absolute; inset: 0; background: center/cover no-repeat; transform: scale(1.0);
      animation: push var(--dur) linear forwards, fadeIn .35s ease-out both; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,12,6,.15) 0%, rgba(21,12,6,0) 35%, rgba(21,12,6,.55) 70%, rgba(21,12,6,.85) 100%); }
.slogan { position: absolute; left: 0; right: 0; top: 52%; text-align: center; transform: rotate(-4deg); }
.slogan span { display: inline-block; font-weight: 700; font-size: 10.5vmin; letter-spacing: .04em; color: #1b1210;
               text-shadow: 0 0 .2vmin rgba(255,255,255,.35); opacity: 0; transform: scale(1.5); filter: blur(.8vmin);
               animation: ink .32s calc(var(--ts) + var(--d)) cubic-bezier(.3, 1.3, .5, 1) forwards; }
.slogan .w { display: block; line-height: 1.02; }
.sub { position: absolute; left: 6%; right: 6%; top: 79%; text-align: center; }
.sub .line { width: 52vmin; height: .25vmin; margin: 0 auto 2.4vmin; transform: scaleX(0);
             background: linear-gradient(90deg, rgba(224,187,106,0), var(--gold) 30%, var(--gold) 70%, rgba(224,187,106,0));
             animation: open .8s var(--tsub) var(--ease) forwards; }
.sub b { display: inline-block; font-weight: 600; font-size: 6.4vmin; letter-spacing: .1em; text-transform: uppercase; color: var(--gold);
         text-shadow: 0 .4vmin 1.6vmin rgba(21,12,6,.85); clip-path: inset(0 100% 0 0); filter: blur(.6vmin);
         animation: wipe .9s calc(var(--tsub) + .1s) var(--ease) forwards; }
@keyframes push { to { transform: scale(1.08); } }
@keyframes ink { to { opacity: .92; transform: none; filter: none; } }
@keyframes open { to { transform: scaleX(1); } }
@keyframes wipe { to { clip-path: inset(0 0 0 0); filter: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="bg" id="bg"></div><div class="shade"></div>
  <div class="slogan" id="sl"></div>
  <div class="sub"><div class="line"></div><b id="sub"></b></div>
</div>
<script>
const r = document.documentElement.style;
const it = k => (P.items || []).find(i => i.kind === k) || {};
r.setProperty('--ts', (+(it('text').t ?? P.t_text ?? 0.2)).toFixed(2) + 's');
r.setProperty('--tsub', (+(it('sub').t ?? P.t_sub ?? 1.6)).toFixed(2) + 's');
document.getElementById('bg').style.backgroundImage = `url("${(P.files || [])[0] || ''}")`;
let k = 0;
document.getElementById('sl').innerHTML = String(P.text || '').toUpperCase().split(' ').map(w =>
  `<div class="w">${[...w].map(c => `<span style="--d:${(k++ * 0.045).toFixed(3)}s">${esc(c)}</span>`).join('')}</div>`).join('');
document.getElementById('sub').textContent = P.sub || '';
</script></body></html>

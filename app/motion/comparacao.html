<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.row { display: flex; gap: 4vmin; align-items: stretch; }
[data-format=vertical] .row { flex-direction: column; }
.card { width: min(38vw, 60vmin); padding: 4vmin; border-radius: 3vmin; font: 800 5vmin/1.25 "Helvetica Neue", Arial, sans-serif;
        box-shadow: 0 3vmin 7vmin rgba(0,0,0,.45); }
.card small { display: block; font: 900 3.6vmin "Arial Black", sans-serif; letter-spacing: .08em; margin-bottom: 2vmin; opacity: .85; text-transform: uppercase; }
.l { background: #2a2d36; color: #e8e8ea; animation: l .5s cubic-bezier(.2,1.3,.4,1) both; }
.r { background: var(--accent); color: #111; animation: r .5s .35s cubic-bezier(.2,1.3,.4,1) both; }
.vs { align-self: center; font-size: 8vmin; color: #fff; animation: vs .4s .2s cubic-bezier(.2,1.8,.4,1) both; -webkit-text-stroke: .03em #000; paint-order: stroke fill; }
@keyframes l { from { transform: translateX(-10vmin); opacity: 0; } }
@keyframes r { from { transform: translateX(10vmin); opacity: 0; } }
@keyframes vs { from { transform: scale(0) rotate(-40deg); } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="row"><div class="card l"><small id="ll"></small><span id="lt"></span></div><div class="vs">VS</div><div class="card r"><small id="rl"></small><span id="rt"></span></div></div></div>
<script>
document.getElementById('ll').textContent = P.left_label || 'Antes';
document.getElementById('rl').textContent = P.right_label || 'Depois';
document.getElementById('lt').textContent = P.left || '';
document.getElementById('rt').textContent = P.right || '';
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- ACRÔNIMO (ex.: AIDA), versão editorial Kronos: sóbrio e elegante — nada de botões 3D nem quiques.
     Cada linha entra no momento em que a palavra é falada (params.items = [{letter, word, t}]): a inicial em dourado,
     um fio dourado que se desenha e a palavra revelada por uma cortina suave, saindo do desfoque.
     No fim (params.final_t) as linhas se dissolvem e o acrônimo surge espaçado, letra por letra, sobre um fio
     que se abre do centro, com as palavras em versalete embaixo. Cores Kronos. -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --ease: cubic-bezier(.22, 1, .36, 1); --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; --onyx: #150C06; }
body { font-family: MA, "Helvetica Neue", sans-serif; }

/* véu ônix bem suave na metade de baixo: dá leitura sem virar "caixa" */
.veil { position: absolute; inset: 0; opacity: 0;
        background: linear-gradient(180deg, rgba(21,12,6,0) 30%, rgba(21,12,6,.55) 62%, rgba(21,12,6,.7) 100%);
        animation: fadeIn .8s var(--t0) ease-out both; }

/* ---- lista ---- */
.rows { position: absolute; left: 11%; right: 8%; top: 54%; display: flex; flex-direction: column; gap: 3.6vmin; }
.row { display: flex; align-items: center; gap: 3.2vmin;
       animation: rowOut .6s var(--tf) var(--ease) both; }
.num { width: 5vmin; font-size: 2.4vmin; font-weight: 600; letter-spacing: .2em; color: var(--sand);
       opacity: 0; animation: fadeIn .6s calc(var(--t) + .05s) ease-out both; }
.ini { width: 8vmin; text-align: center; font-size: 9vmin; font-weight: 600; line-height: 1; color: var(--gold);
       text-shadow: 0 .4vmin 2vmin rgba(21,12,6,.6);
       opacity: 0; animation: iniIn .7s var(--t) var(--ease) both; }
.rule { width: .22vmin; height: 7vmin; background: linear-gradient(180deg, rgba(224,187,106,0), var(--gold), rgba(224,187,106,0));
        transform: scaleY(0); animation: grow .6s calc(var(--t) + .1s) var(--ease) both; }
.word { font-size: 6vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cream);
        text-shadow: 0 .3vmin 1.6vmin rgba(21,12,6,.75);
        clip-path: inset(0 100% 0 0); filter: blur(.8vmin); opacity: 0;
        animation: wipe .9s calc(var(--t) + .15s) var(--ease) both; }
@keyframes iniIn { from { opacity: 0; transform: translateY(2.5vmin); filter: blur(1vmin); } to { opacity: 1; transform: none; filter: none; } }
@keyframes grow { to { transform: scaleY(1); } }
@keyframes wipe { to { clip-path: inset(0 0 0 0); filter: none; opacity: 1; } }
@keyframes rowOut { to { opacity: 0; transform: translateY(-2vmin); filter: blur(.8vmin); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---- acrônimo final ---- */
.final { position: absolute; left: 0; right: 0; top: 60%; display: flex; flex-direction: column; align-items: center; }
.big { display: flex; justify-content: center; padding-left: .32em; font-size: 19vmin; font-weight: 600; line-height: 1;
       letter-spacing: .32em; }
.big span { display: inline-block; overflow: hidden; padding: .04em 0; }
.big i { display: inline-block; font-style: normal;
         background: linear-gradient(180deg, #F3DDA6 0%, var(--gold) 55%, #B8924A 100%); -webkit-background-clip: text; color: transparent;
         filter: drop-shadow(0 .5vmin 1.8vmin rgba(21,12,6,.55));
         transform: translateY(105%); animation: rise 1s calc(var(--tf) + .25s + var(--d)) var(--ease) both; }
.line { width: 64vmin; height: .22vmin; margin-top: 3vmin;
        background: linear-gradient(90deg, rgba(224,187,106,0), var(--gold) 30%, var(--gold) 70%, rgba(224,187,106,0));
        transform: scaleX(0); animation: open 1.1s calc(var(--tf) + .15s) var(--ease) both; }
.sub { margin-top: 3vmin; font-size: 2.7vmin; font-weight: 600; letter-spacing: .38em; text-transform: uppercase;
       color: var(--cream); opacity: 0; text-shadow: 0 .3vmin 1.2vmin rgba(21,12,6,.8);
       animation: subIn .9s calc(var(--tf) + .75s) var(--ease) both; }
.sub em { font-style: normal; color: var(--sand); margin: 0 .5em; }
@keyframes rise { to { transform: none; } }
@keyframes open { to { transform: scaleX(1); } }
@keyframes subIn { from { opacity: 0; letter-spacing: .6em; filter: blur(.6vmin); } to { opacity: 1; letter-spacing: .38em; filter: none; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="veil"></div>
  <div class="rows" id="rows"></div>
  <div class="final"><div class="big" id="big"></div><div class="line"></div><div class="sub" id="sub"></div></div>
</div>
<script>
const items = P.items || [];
const tf = P.final_t != null ? P.final_t : (+P.dur || 3) - 1.4;
const root = document.documentElement.style;
root.setProperty('--tf', tf + 's');
root.setProperty('--t0', Math.max(0, (+items[0]?.t || 0) - 0.2) + 's');
const L = it => it.letter || (it.word || '?')[0].toUpperCase();
document.getElementById('rows').innerHTML = items.map((it, k) => {
  const t = (+it.t || 0).toFixed(2), w = it.word || '';
  return `<div class="row" style="--t:${t}s"><div class="num">${String(k + 1).padStart(2, '0')}</div>
    <div class="ini">${esc(L(it))}</div><div class="rule"></div><div class="word">${esc(w)}</div></div>`;
}).join('');
const word = P.title || items.map(L).join('');
document.getElementById('big').innerHTML = [...word].map((c, i) => `<span><i style="--d:${(i * 0.08).toFixed(2)}s">${esc(c)}</i></span>`).join('');
document.getElementById('sub').innerHTML = items.map(it => esc(it.word)).join('<em>·</em>');
</script></body></html>

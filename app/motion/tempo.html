<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- TEMPO = REBOBINAR ATÉ X ANOS ATRÁS (V011, comentário dele em "cinquenta mil anos": "fazer efeito diferente na edição"):
     uma régua do tempo corre para trás, cada vez mais rápido, passando pelos marcos (params.marks: [{y, label}]) enquanto
     o contador sobe (params.value, ex.: 50000); freia e para no alvo, e o fundo vira a imagem do lugar (files[0]) com a
     legenda pequena (params.place). Use com o som "rebobinar". Para a faixa de cima da tela dividida (layout meio);
     funciona em tela cheia. Sóbrio: sem brilho, sem quique. -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; --onyx: #150C06; --sepia: #2E2017; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: var(--onyx); }
.stage { display: block; }
.bg { position: absolute; inset: 0; background: radial-gradient(80% 85% at 50% 40%, rgba(46,32,23,.9), rgba(21,12,6,1) 80%); }
.photo { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; will-change: transform, opacity; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,12,6,.15) 0%, rgba(21,12,6,.25) 45%, rgba(21,12,6,.88) 100%); opacity: 0; }
.ruler { position: absolute; left: 0; right: 0; height: 30%; bottom: 12%; overflow: hidden; }
.track { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; will-change: transform; }
.tk { position: absolute; bottom: 30%; width: .28vmin; background: rgba(168,144,112,.55); }
.tk.big { background: rgba(245,239,230,.75); width: .34vmin; }
.mk { position: absolute; bottom: 68%; transform: translateX(-50%); color: var(--cream); font-weight: 600; font-size: 3vmin; white-space: nowrap; letter-spacing: .02em; }
.mk b { display: block; white-space: nowrap; color: var(--sand); font-weight: 600; font-size: 2.3vmin; letter-spacing: .18em; text-transform: uppercase; margin-top: .4vmin; }
.base { position: absolute; left: 4%; right: 4%; bottom: 30%; height: .25vmin; background: rgba(168,144,112,.5); }
.head { position: absolute; left: 50%; bottom: 14%; width: .5vmin; height: 70%; background: var(--gold); transform: translateX(-50%); }
.count { position: absolute; left: 0; right: 0; top: 18%; text-align: center; color: var(--gold); font-weight: 700; font-size: 17vmin; line-height: 1;
         font-variant-numeric: tabular-nums; text-shadow: 0 .6vmin 2.4vmin rgba(0,0,0,.6); }
.unit { position: absolute; left: 0; right: 0; top: calc(18% + 19vmin); text-align: center; color: var(--cream); font-weight: 600; font-size: 3.6vmin;
        letter-spacing: .32em; text-transform: uppercase; text-shadow: 0 .4vmin 1.6vmin rgba(0,0,0,.7); }
.place { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; color: var(--sand); font-weight: 600; font-size: 2.6vmin;
         letter-spacing: .26em; text-transform: uppercase; opacity: 0; }
.rw { position: absolute; left: 0; right: 0; top: 7%; text-align: center; color: var(--sand); font-weight: 700; font-size: 3vmin; letter-spacing: .2em; }
</style></head><body><script src="_base.js"></script>
<script>if (innerWidth > innerHeight * 1.05) document.documentElement.dataset.band = '1';</script>
<div class="stage exit"><div class="bg"></div><div class="photo" id="photo"></div><div class="shade" id="shade"></div>
  <div class="rw" id="rw"><svg viewBox="0 0 40 20" style="width:7vmin;height:3.5vmin"><path d="M20 0 L0 10 L20 20 Z M40 0 L20 10 L40 20 Z" fill="#A89070"/></svg></div>
  <div class="count" id="count">0</div><div class="unit" id="unit"></div>
  <div class="ruler" id="ruler"><div class="base"></div><div class="track" id="track"></div><div class="head"></div></div>
  <div class="place" id="place"></div></div>
<script>
const Wd = innerWidth, vm = Math.min(Wd, innerHeight) / 100;
const V = Math.max(1, +P.value || 50000), F = P.files || [];
const marks = P.marks || [{ y: 0, label: 'hoje' }, { y: 5000, label: 'a escrita' },
                          { y: 17000, label: 'Lascaux' }, { y: V, label: P.target || '' }];
const photo = document.getElementById('photo'), shade = document.getElementById('shade'), track = document.getElementById('track');
const count = document.getElementById('count'), unit = document.getElementById('unit'), place = document.getElementById('place');
const rw = document.getElementById('rw');
if (P.forward) rw.style.transform = 'scaleX(-1)';
if (F[0]) photo.style.backgroundImage = `url("${F[0]}")`;
unit.textContent = P.unit ?? 'anos atrás';
place.textContent = P.place || '';
// régua: 1 ano = PX pixels; o "agora" fica no centro da tela e o passado à ESQUERDA (rebobinar = a régua anda para a direita)
const DIR = P.forward ? -1 : 1;                       // forward = AVANÇAR no tempo (V018: 'corta pra quase dois mil anos depois')
const FROM = +P.from || 0;                            // forward: o contador mostra o ANO (de FROM até FROM + value)
const PX = (Wd * 0.34) / 1000;                       // 1.000 anos ocupam ~1/3 da largura: no começo dá para ler os marcos
const STEP = 1000;
for (let y = 0; y <= V + 6000; y += STEP / 4) {
  const el = document.createElement('div');
  const big = y % STEP === 0;
  el.className = 'tk' + (big ? ' big' : '');
  el.style.left = (-DIR * y * PX) + 'px'; el.style.height = (big ? 34 : 18) + '%';
  track.appendChild(el);
}
for (const m of marks) {
  if (!m.label) continue;
  const el = document.createElement('div'); el.className = 'mk';
  el.style.left = (-DIR * m.y * PX) + 'px';
  el.innerHTML = `${esc(m.label)}<b>${esc(m.sub ?? (P.forward ? String(FROM + m.y) : (m.y ? m.y.toLocaleString('pt-BR') + ' anos' : '')))}</b>`;
  track.appendChild(el);
}
const T1 = Math.min((+P.dur || 3) - 0.6, Math.max(1.2, +P.run || 1.7));     // fim da corrida (freia e para no alvo)
// posição no tempo: começa devagar, acelera (rebobinando) e freia no fim
const io = x => { x = Math.max(0, Math.min(1, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const fmt = n => Math.round(n).toLocaleString('pt-BR');
let last = 0;
function paint(t) {
  const p = io((t - 0.15) / T1);
  const y = V * p;
  track.style.transform = `translateX(${(Wd / 2 + DIR * y * PX).toFixed(1)}px)`;
  // borrão de movimento proporcional à velocidade (a régua "voando" no meio do rebobinar)
  const v = Math.abs(io((t - 0.15 + 0.02) / T1) - io((t - 0.15 - 0.02) / T1)) / 0.04;   // dp/dt
  track.style.filter = `blur(${Math.min(5, v * 2.2).toFixed(2)}px)`;
  const shown = p >= 0.999 ? V : Math.floor(y / 100) * 100;
  count.textContent = P.forward ? String(Math.round(FROM + (p >= 0.999 ? V : y))) : fmt(shown);
  rw.style.opacity = (Math.min(1, t / 0.2) * (1 - io((t - T1) / 0.3))).toFixed(3);
  // chegada: o fundo vira o lugar (a caverna), com zoom lento; contador fica
  const arr = io((t - (0.15 + T1 * 0.82)) / 0.6);
  photo.style.opacity = (0.92 * arr).toFixed(3);
  photo.style.transform = `scale(${(1.12 - 0.06 * arr + 0.012 * Math.max(0, t - T1)).toFixed(4)})`;
  shade.style.opacity = arr.toFixed(3);
  document.getElementById('ruler').style.opacity = (1 - 0.65 * arr).toFixed(3);
  place.style.opacity = io((t - T1 - 0.2) / 0.5).toFixed(3);
  count.style.transform = `scale(${(1 + 0.06 * io((t - T1) / 0.25) - 0.06 * io((t - T1 - 0.25) / 0.3)).toFixed(4)})`;
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

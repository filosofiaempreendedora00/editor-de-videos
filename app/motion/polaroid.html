<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- POLAROID (Joshie na piscina), editorial Kronos: fundo = a própria foto desfocada e escurecida aproximando devagar;
     duas polaroids do álbum entram por trás (profundidade); a polaroid principal cai em 3D e ASSENTA sem quicar
     (pedido dele: nada de quiques); a foto "revela" como uma polaroid de verdade (do branco leitoso para a cor);
     embaixo, a pergunta com a palavra-chave em dourado. params.files = [principal, trás1, trás2];
     params.label (legenda da polaroid), params.pre / params.key / params.post (texto), params.t_text. -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --ease: cubic-bezier(.16, 1, .3, 1); --gold: #E0BB6A; --cream: #F5EFE6; --onyx: #150C06; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: var(--onyx); }
.stage { display: block; perspective: 140vmin; }
.bg { position: absolute; inset: -4%; background: center/cover no-repeat; filter: blur(3.2vmin) brightness(.42) saturate(.85);
      transform: scale(1.04); animation: bgz var(--dur) linear forwards, fade .5s ease-out both; }
.veil { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 38%, rgba(21,12,6,0) 0%, rgba(21,12,6,.55) 75%); }
.pol { position: absolute; left: 50%; top: 36%; width: 74vmin; padding: 3vmin 3vmin 11vmin; background: #f7f3ea;
       border-radius: .6vmin; box-shadow: 0 3vmin 7vmin rgba(0,0,0,.55), 0 .4vmin 1vmin rgba(0,0,0,.35);
       transform-style: preserve-3d; }
.pol .ph { width: 100%; aspect-ratio: 1 / 1; background: center/cover no-repeat #ddd; }
.pol .lb { position: absolute; left: 0; right: 0; bottom: 3.4vmin; text-align: center; color: #3a2a1e; font-weight: 600;
           font-size: 3.3vmin; letter-spacing: .04em; opacity: 0; animation: fade .8s calc(var(--tm) + 1.4s) ease-out forwards; }
.main { transform: translate(-50%, -50%) translateY(-75vh) rotateX(58deg) rotateZ(-24deg) scale(1.25); opacity: 0;
        animation: drop 1.05s var(--tm) var(--ease) forwards; }
.main .ph { filter: brightness(1.75) saturate(0) contrast(.45) sepia(.25); animation: develop 2.2s calc(var(--tm) + .7s) ease-out forwards; }
.back { width: 62vmin; padding: 2.4vmin 2.4vmin 9vmin; opacity: 0; filter: blur(.25vmin) brightness(.8);
        animation: slide .9s var(--tb) var(--ease) forwards; }
.b1 { --r0: -40deg; --r1: -15deg; --x0: -120vw; --x1: -64%; --y1: -54%; }
.b2 { --r0: 40deg;  --r1: 12deg;  --x0: 120vw;  --x1: -36%; --y1: -47%; }
.back { transform: translate(var(--x0), -50%) rotate(var(--r0)); }
.txt { position: absolute; left: 6%; right: 6%; top: 70%; text-align: center; color: var(--cream);
       text-shadow: 0 .5vmin 2vmin rgba(0,0,0,.7); }
.txt .a, .txt .c { display: block; font-weight: 600; font-size: 6.4vmin; letter-spacing: .02em; opacity: 0;
                   transform: translateY(2vmin); filter: blur(.8vmin); animation: up .7s var(--tt) var(--ease) forwards; }
.txt .k { display: block; font-weight: 700; font-size: 16vmin; line-height: 1.02; letter-spacing: .01em;
          background: linear-gradient(180deg, #F3DDA6 0%, var(--gold) 55%, #B8924A 100%); -webkit-background-clip: text; color: transparent;
          opacity: 0; transform: translateY(3vmin) scale(.96); filter: blur(1vmin) drop-shadow(0 .6vmin 1.6vmin rgba(0,0,0,.6));
          animation: up .9s calc(var(--tt) + .15s) var(--ease) forwards; }
.txt .c { animation-delay: calc(var(--tt) + .35s); }
@keyframes drop { 0% { opacity: 0; } 12% { opacity: 1; }
                  100% { opacity: 1; transform: translate(-50%, -50%) translateY(0) rotateX(0deg) rotateZ(-4deg) scale(1); } }
@keyframes develop { to { filter: none; } }
@keyframes slide { to { opacity: .92; transform: translate(var(--x1), var(--y1)) rotate(var(--r1)); } }
@keyframes up { to { opacity: 1; transform: none; filter: none; } }
@keyframes bgz { to { transform: scale(1.12); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="bg" id="bg"></div><div class="veil"></div>
  <div class="pol back b1" id="b1"><div class="ph"></div></div>
  <div class="pol back b2" id="b2"><div class="ph"></div></div>
  <div class="pol main" id="m"><div class="ph"></div><div class="lb" id="lb"></div></div>
  <div class="txt"><span class="a" id="pre"></span><span class="k" id="key"></span><span class="c" id="post"></span></div>
</div>
<script>
const f = P.files || [], r = document.documentElement.style;
const it = k => (P.items || []).find(i => i.kind === k) || {};
const tm = +(it('main').t ?? P.t_main ?? 0.35), tt = +(it('text').t ?? P.t_text ?? 1.4);
r.setProperty('--tm', tm.toFixed(2) + 's'); r.setProperty('--tb', Math.max(0, tm - 0.25).toFixed(2) + 's'); r.setProperty('--tt', tt.toFixed(2) + 's');
const set = (id, src) => { const el = document.querySelector(`#${id} .ph`); if (el && src) el.style.backgroundImage = `url("${src}")`; };
document.getElementById('bg').style.backgroundImage = `url("${f[0] || ''}")`;
set('m', f[0]); set('b1', f[1] || f[0]); set('b2', f[2] || f[1] || f[0]);
if (!f[1]) document.getElementById('b1').remove();
if (!f[2] && !f[1]) document.getElementById('b2').remove();
document.getElementById('lb').textContent = P.label || '';
document.getElementById('pre').textContent = P.pre || '';
document.getElementById('key').textContent = P.key || '';
document.getElementById('post').textContent = P.post || '';
</script></body></html>

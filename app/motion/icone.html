<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.wrap { display: flex; flex-direction: column; align-items: center; gap: 3vmin; }
.vertical .wrap, [data-format=vertical] .wrap { margin-top: -18vh; }
.badge { position: relative; width: 30vmin; height: 30vmin; border-radius: 50%; display: grid; place-items: center;
         background: radial-gradient(circle at 35% 30%, #ffffff, #e9e9ee 60%, #cfd0d8); box-shadow: 0 2vmin 6vmin rgba(0,0,0,.45);
         animation: pop .6s cubic-bezier(.2,1.7,.4,1) both, float 2.4s .6s ease-in-out infinite alternate; }
.badge::before { content: ""; position: absolute; inset: -3vmin; border-radius: 50%; border: .8vmin solid var(--accent);
                 animation: ring .9s .15s ease-out both; }
.emoji { font-family: "Apple Color Emoji", sans-serif; font-size: 17vmin; line-height: 1; animation: wob .7s .25s ease-out both; }
.label { font-size: 7vmin; text-transform: uppercase; background: var(--accent); color: #111; padding: .15em .5em; border-radius: .2em;
         animation: lab .45s .35s cubic-bezier(.2,1.5,.4,1) both; box-shadow: 0 1vmin 3vmin rgba(0,0,0,.35); }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } }
@keyframes float { to { transform: translateY(-1.5vmin) rotate(3deg); } }
@keyframes ring { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
@keyframes wob { 0% { transform: scale(.4) } 60% { transform: scale(1.15) rotate(8deg) } 100% { transform: none } }
@keyframes lab { from { transform: translateY(3vmin) scale(.7); opacity: 0; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="wrap"><div class="badge"><span class="emoji" id="e"></span></div><div class="label" id="t"></div></div></div>
<script>
document.getElementById('e').textContent = P.icon || '💡';
const t = document.getElementById('t');
if (P.label) t.textContent = P.label; else t.remove();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- O ANÚNCIO DE DESCONTO NO FEED (V019, Schwartz): um celular de verdade em tela cheia, no fundo a foto do produto
     desfocada; no feed, o post patrocinado da marca de colchões com o selo "30% OFF" e o botão "Comprar agora".
     params.mode "ignora": o feed rola devagar e, no instante falado (items kind "flick" com t), o dedo joga o anúncio
     para cima e ele passa reto (borrão de movimento), o feed segue com outros posts.
     params.mode "compra": o feed sobe e PARA no mesmo anúncio; no instante falado (kind "tap") o botão é tocado (anel
     se abrindo) e sobe a folha "Pedido confirmado". params.img (foto do produto), params.brand, params.text, params.off.
     Sóbrio e na paleta Kronos: nada de brilho nem quique. -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --ease: cubic-bezier(.16, 1, .3, 1); --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; --onyx: #150C06;
        --sepia: #2E2017; --coral: #F0916B; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: var(--onyx); }
.stage { display: block; }
.bg { position: absolute; inset: -5%; background: center/cover no-repeat var(--onyx);
      filter: blur(3.4vmin) brightness(.36) saturate(.8); transform: scale(1.04); animation: bgz var(--dur) linear forwards; }
.veil { position: absolute; inset: 0; background: radial-gradient(100% 70% at 50% 35%, rgba(21,12,6,0), rgba(21,12,6,.6) 85%); }
.phone { position: absolute; left: 50%; top: 4%; width: 61vmin; height: 114vmin; transform: translateX(-50%);
         border-radius: 8vmin; background: #0d0907; padding: 1.8vmin; box-sizing: border-box;
         box-shadow: 0 4vmin 9vmin rgba(0,0,0,.6), inset 0 0 0 .35vmin #2a211b;
         opacity: 0; animation: pin .8s var(--ease) forwards; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 6.4vmin; overflow: hidden; background: #fbf8f3; }
.bar { position: absolute; left: 0; right: 0; top: 0; height: 8vmin; z-index: 3; background: #fbf8f3;
       display: flex; align-items: center; justify-content: space-between; padding: 0 6vmin; box-sizing: border-box;
       font-weight: 700; font-size: 2.6vmin; color: #1c1410; }
.bar i { width: 15vmin; height: 3.8vmin; border-radius: 2vmin; background: #0d0907; position: absolute; left: 50%; top: 1.6vmin;
         transform: translateX(-50%); }
.feed { position: absolute; left: 0; right: 0; top: 8vmin; will-change: transform; }
.post { padding: 2.2vmin 0 3vmin; border-bottom: .2vmin solid #ece4d8; }
.ph { display: flex; align-items: center; gap: 1.8vmin; padding: 0 3vmin 1.8vmin; }
.av { width: 5.6vmin; height: 5.6vmin; border-radius: 50%; background: var(--sand); flex: none; }
.who { font-size: 2.6vmin; font-weight: 700; color: #1c1410; line-height: 1.15; }
.who small { display: block; font-weight: 600; font-size: 2.1vmin; color: #8a7a68; }
.img { position: relative; width: 100%; aspect-ratio: 1 / 1; background: center/cover no-repeat #e7ded0; }
.ghost .img { background: linear-gradient(135deg, #e9e0d3, #d8ccbb); }
.ghost .who { width: 22vmin; height: 2.2vmin; border-radius: 1vmin; background: #e2d8ca; }
.off { position: absolute; left: 2.6vmin; top: 2.6vmin; padding: 1vmin 2vmin; border-radius: 1vmin; background: var(--coral);
       color: var(--onyx); font-weight: 700; font-size: 4.4vmin; letter-spacing: .02em; box-shadow: 0 .5vmin 1.4vmin rgba(0,0,0,.25); }
.cta { position: relative; margin: 0; height: 7.6vmin; background: var(--sepia); color: var(--cream); display: flex;
       align-items: center; justify-content: space-between; padding: 0 3.4vmin; font-weight: 700; font-size: 3vmin; overflow: hidden; }
.cta.press { background: #1c130d; }
.ring { position: absolute; width: 4vmin; height: 4vmin; border-radius: 50%; border: .5vmin solid var(--gold);
        left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; }
.cap { padding: 2vmin 3vmin 0; font-size: 2.55vmin; line-height: 1.35; color: #2b2019; }
.cap b { font-weight: 700; }
.lines i { display: block; height: 2vmin; margin: 1.4vmin 3vmin 0; border-radius: 1vmin; background: #ebe2d6; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; z-index: 4; background: var(--sepia);
         border-radius: 4vmin 4vmin 0 0; transform: translateY(105%); display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 1.6vmin; color: var(--cream); }
.ok { width: 11vmin; height: 11vmin; border-radius: 50%; border: .5vmin solid var(--gold); position: relative; }
.ok::after { content: ""; position: absolute; left: 3.3vmin; top: 1.6vmin; width: 3vmin; height: 5.6vmin;
             border-right: .7vmin solid var(--gold); border-bottom: .7vmin solid var(--gold); transform: rotate(40deg) scale(0);
             transform-origin: 60% 80%; }
.sheet.on .ok::after { animation: chk .5s .25s var(--ease) forwards; }
.sheet b { font-size: 4vmin; font-weight: 700; }
.sheet span { font-size: 2.6vmin; color: var(--sand); letter-spacing: .08em; }
@keyframes chk { to { transform: rotate(40deg) scale(1); } }
/* TELA DIVIDIDA (faixa de cima, mais larga que alta): o celular de perto, maior, a parte de cima da tela — a parte
   de baixo do aparelho sai pela divisa (você fica embaixo) */
html[data-band] .phone { top: 6%; transform: translateX(-50%) scale(1.45); transform-origin: 50% 0;
                         animation: pinb .6s var(--ease) forwards; }
@keyframes pinb { from { opacity: 0; filter: blur(1vmin); } to { opacity: 1; filter: none; } }
html[data-band] .sheet { top: 9.5vmin; bottom: auto; left: 3vmin; right: 3vmin; height: 36vmin; border-radius: 3vmin;
                         box-shadow: 0 2vmin 5vmin rgba(0,0,0,.35); }
.ghost.real .img { background-color: #e7ded0; }
.ghost.real .who { width: auto; height: auto; background: none; }
.ok { border: none !important; width: 12vmin !important; height: 12vmin !important; }
.ok::after { content: none !important; }
.ok svg { width: 100%; height: 100%; overflow: visible; }
.ok circle, .ok path { fill: none; stroke: var(--gold); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes pin { from { opacity: 0; transform: translateX(-50%) translateY(4vmin) scale(.97); filter: blur(1vmin); }
                 to { opacity: 1; transform: translateX(-50%); filter: none; } }
@keyframes bgz { to { transform: scale(1.13); } }
</style></head><body><script src="_base.js"></script><script>// faixa de cima da tela dividida (mais larga que alta): layout próprio
if (innerWidth > innerHeight * 1.05) document.documentElement.dataset.band = '1';
</script>
<div class="stage exit">
  <div class="bg" id="bg"></div><div class="veil"></div>
  <div class="phone"><div class="scr">
    <div class="bar"><span>9:41</span><i></i><span>●●●</span></div>
    <div class="feed" id="feed"></div>
    <div class="sheet" id="sheet"><div class="ok"><svg viewBox="0 0 48 48"><circle id="okc" cx="24" cy="24" r="21" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 24 24)"/><path id="okp" d="M15 24.5 L21.5 31 L33.5 17.5" stroke-dasharray="30" stroke-dashoffset="30"/></svg></div><b>Pedido confirmado</b><span id="sh2"></span></div>
  </div></div>
</div>
<script>
const mode = P.mode || 'ignora';
const brand = P.brand || 'colchoes.aurora', off = P.off || '30% OFF';
const text = P.text || 'Seu novo colchão com 30% de desconto. Só esta semana.';
const items = P.items || [];
const itT = (k, d) => { const i = items.find(x => x.kind === k); return i ? +i.t : d; };
const IMG = (P.files || [])[0] || P.img;
if (IMG) document.getElementById('bg').style.backgroundImage = `url("${IMG}")`;
// os posts vizinhos: fotos de verdade (params.files[1..]) com nome — vazio parecia tela quebrada ("muito espaço em branco")
const OTHERS = (P.files || []).slice(1), ONAMES = P.others || ['casa.moderna', 'ana.ribeiro', 'cozinha.ja', 'viagens.br'];
let gi = 0;
const ghost = () => { const k = gi++;
  if (!OTHERS.length) return `<div class="post ghost"><div class="ph"><div class="av" style="background:#d9cfc1"></div><div class="who"></div></div>
  <div class="img"></div><div class="lines"><i style="width:70%"></i><i style="width:45%"></i></div></div>`;
  const im = OTHERS[k % OTHERS.length];
  return `<div class="post ghost real"><div class="ph"><div class="av" style="background:center/cover url('${im}')"></div><div class="who">${esc(ONAMES[k % ONAMES.length])}</div></div>
  <div class="img" style="background-image:url('${im}')"></div><div class="lines"><i style="width:70%"></i><i style="width:45%"></i></div></div>`; };
const ad = `<div class="post" id="ad"><div class="ph"><div class="av"></div><div class="who">${esc(brand)}<small>Patrocinado</small></div></div>
  <div class="img" id="adimg"><div class="off" style="${P.off_pos ? `left:${P.off_pos[0]}%;top:${P.off_pos[1]}%` : ''}">${esc(off)}</div></div>
  <div class="cta" id="cta"><span>Comprar agora</span><span>›</span><div class="ring" id="ring"></div></div>
  <div class="cap"><b>${esc(brand)}</b> ${esc(text)}</div></div>`;
const feed = document.getElementById('feed');
feed.innerHTML = ghost() + ad + ghost() + ghost() + ghost();
if (IMG) document.getElementById('adimg').style.backgroundImage = `url("${IMG}")`;
document.getElementById('sh2').textContent = (P.product || 'Colchão') + ' · ' + off;
const vm = Math.min(innerWidth, innerHeight) / 100;
const adEl = document.getElementById('ad');
const adY = () => adEl.offsetTop;                      // px dentro do feed
const ease = x => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
const tFlick = itT('flick', 1.0), tTap = itT('tap', 1.2);
const ring = document.getElementById('ring'), cta = document.getElementById('cta'), sheet = document.getElementById('sheet');
function paint(t) {
  const top0 = adY() - 3 * vm;                         // o anúncio encostado no alto da tela
  let y;
  if (mode === 'ignora') {
    // chega devagar até o anúncio, e no flick ele sai voando para cima (passa reto) e o feed desacelera
    const settle = top0 - 30 * vm + ease(t / 0.9) * 30 * vm + Math.min(t, tFlick) * 1.2 * vm;
    const fl = ease((t - tFlick) / 0.7);
    y = settle + fl * 150 * vm + Math.max(0, t - tFlick - 0.7) * 2 * vm;
    const v = t > tFlick && t < tFlick + 0.45 ? (1 - (t - tFlick) / 0.45) : 0;
    feed.style.filter = v > 0 ? `blur(${(v * 1.4).toFixed(2)}vmin)` : 'none';
  } else {
    // sobe rápido e PARA no anúncio (ela agora está pronta); depois o toque e a confirmação
    y = top0 - 90 * vm + ease(t / 1.0) * 90 * vm + Math.max(0, t - 1) * 0.6 * vm;
    feed.style.filter = t < 0.5 ? `blur(${((0.5 - t) * 1.6).toFixed(2)}vmin)` : 'none';
    const r = (t - tTap) / 0.6;
    ring.style.opacity = r > 0 && r < 1 ? (1 - r).toFixed(3) : 0;
    ring.style.transform = `translate(-50%, -50%) scale(${r > 0 ? (1 + r * 9).toFixed(2) : 0})`;
    cta.classList.toggle('press', r > 0 && r < 0.5);
    const s = ease((t - tTap - 0.35) / 0.7);
    const BAND = !!document.documentElement.dataset.band;
    sheet.style.transform = BAND ? `translateY(${(-135 + s * 135).toFixed(1)}%)` : `translateY(${(105 - s * 105).toFixed(1)}%)`;
    sheet.classList.toggle('on', s > 0.5);
    // o check se desenha: primeiro o aro, depois o traço (fino, dourado — o ::after torto foi reprovado)
    document.getElementById('okc').style.strokeDashoffset = (132 * (1 - ease((t - tTap - 0.55) / 0.5))).toFixed(1);
    document.getElementById('okp').style.strokeDashoffset = (30 * (1 - ease((t - tTap - 0.95) / 0.35))).toFixed(1);
  }
  feed.style.transform = `translateY(${(-y).toFixed(1)}px)`;
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- AO SEU ALCANCE (Epicteto 20/10, no lugar do círculo da dicotomia: "algo como a mãozinha dando zoom na obra de
     Michelangelo, Deus e o homem alcançando um ao outro"): A Criação de Adão inteira e a câmera mergulha devagar até
     as duas mãos encherem a tela. Em "ao seu ALCANCE" a palavra entra dourada embaixo; em "não estão" um fio dourado
     mede o espaço entre os dedos — o que nunca se toca — e o texto vira "e o que NÃO ESTÁ". Sóbrio, sem brilho.
     params.files = [obra], params.gap = [x, y] (0..1 na obra), params.items = [{kind: "alcance"|"nao", t}],
     params.l1/k1 (linha pequena/palavra 1), params.l2/k2 -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
:root { --gold: #E0BB6A; --cream: #F5EFE6; --onyx: #150C06; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: var(--onyx); }
.stage { display: block; overflow: hidden; }
.fill { position: absolute; inset: -10%; background-size: cover; background-position: 38% 45%; filter: blur(3vh) brightness(.45) saturate(.8); }
#art { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,12,6,0) 50%, rgba(21,12,6,.7) 72%, rgba(21,12,6,.88) 100%); }
.gapline { position: absolute; height: .35vh; background: var(--gold); transform-origin: 0 50%; box-shadow: 0 0 .8vh rgba(21,12,6,.6); }
.gapline::before, .gapline::after { content: ""; position: absolute; top: -1.1vh; width: .35vh; height: 2.6vh; background: var(--gold); }
.gapline::before { left: 0; } .gapline::after { right: 0; }
.txt { position: absolute; left: 7%; right: 7%; top: 70%; }
.t { position: absolute; left: 0; top: 0; opacity: 0; }
.t small { display: block; color: var(--cream); font-weight: 600; font-size: 4.6vw; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 1vh; }
.t span { display: block; color: var(--gold); font-weight: 600; font-size: 14vw; line-height: .95; letter-spacing: .02em; text-transform: uppercase; }
.t.b span { color: var(--cream); }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="fill" id="fill"></div><img id="art" alt=""><div class="veil"></div><div class="gapline" id="gl"></div>
  <div class="txt"><div class="t a" id="ta"><small id="l1"></small><span id="k1"></span></div>
    <div class="t b" id="tb"><small id="l2"></small><span id="k2"></span></div></div>
</div>
<script>
const f = P.files || [], it = k => (P.items || []).find(i => i.kind === k) || {};
const art = document.getElementById('art');
art.src = f[0] || ''; document.getElementById('fill').style.backgroundImage = `url("${f[0] || ''}")`;
document.getElementById('l1').textContent = P.l1 ?? 'o que está ao seu';
document.getElementById('k1').textContent = P.k1 ?? 'alcance';
document.getElementById('l2').textContent = P.l2 ?? 'e o que';
document.getElementById('k2').textContent = P.k2 ?? 'não está';
const [gx, gy] = P.gap || [0.385, 0.452], gw = +(P.gap_w || 0.022);      // ponto entre os dedos e a largura do vão
const ta = +(it('alcance').t ?? 1.2), tn = +(it('nao').t ?? 2.6), dur = +P.dur || 4;
const S1 = +(P.zoom || 4.6);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, cl = x => Math.max(0, Math.min(1, x));
const out = x => 1 - Math.pow(1 - x, 3);
function paint(t) {
  const W = innerWidth, H = innerHeight, ar = (art.naturalHeight || 1599) / (art.naturalWidth || 3524);
  // mergulho: até o "alcance" chega perto das mãos; depois continua bem devagar
  const p = ease(cl(t / Math.max(0.8, ta + 0.4))) * 0.88 + cl((t - ta - 0.4) / Math.max(0.5, dur - ta - 0.4)) * 0.12;
  const s = 1 + (S1 - 1) * p, Wd = W * s, Hd = Wd * ar;
  const cx = gx * W + (W / 2 - gx * W) * p;                 // o vão vai para o centro da tela
  const cy0 = H * 0.33 - Hd / 2 + gy * Hd;                    // obra inteira no terço de cima
  const cy = (H * 0.33 - W * ar / 2 + gy * W * ar) + (H * 0.38 - (H * 0.33 - W * ar / 2 + gy * W * ar)) * p;
  const left = cx - gx * Wd, top = cy - gy * Hd;
  art.style.width = Wd + 'px'; art.style.transform = `translate(${left.toFixed(1)}px, ${top.toFixed(1)}px)`;
  // o fio dourado no vão entre os dedos (no "não estão")
  const gl = document.getElementById('gl'), eg = out(cl((t - tn) / 0.6));
  gl.style.left = (left + (gx - gw / 2) * Wd).toFixed(1) + 'px'; gl.style.top = (top + gy * Hd).toFixed(1) + 'px';
  gl.style.width = (gw * Wd).toFixed(1) + 'px'; gl.style.opacity = eg.toFixed(3); gl.style.transform = `scaleX(${eg.toFixed(3)})`;
  // textos: ALCANCE entra; no "não estão" ele sai e entra NÃO ESTÁ
  const ea = out(cl((t - ta) / 0.5)), xa = out(cl((t - tn) / 0.35)), eb = out(cl((t - tn - 0.15) / 0.5));
  const A = document.getElementById('ta'), B = document.getElementById('tb');
  A.style.opacity = (ea * (1 - xa)).toFixed(3); A.style.filter = `blur(${((1 - ea) * .8 + xa * .6).toFixed(2)}vh)`;
  A.style.transform = `translateY(${((1 - ea) * 2 - xa * 2).toFixed(2)}vh)`;
  B.style.opacity = eb.toFixed(3); B.style.filter = `blur(${((1 - eb) * .8).toFixed(2)}vh)`;
  B.style.transform = `translateY(${((1 - eb) * 2).toFixed(2)}vh)`;
}
art.addEventListener('load', () => paint(0));
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

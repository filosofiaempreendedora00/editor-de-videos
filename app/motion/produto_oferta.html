<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- PRODUTO × OFERTA (fecho do Liquid Death), editorial Kronos, sóbrio e chamativo: em cima o PRODUTO (foto real das
     águas comuns, fria e apagada); no "completamente diferente" surge um ≠ em areia; embaixo a OFERTA (a lata dourada,
     quente e maior) assenta sem quique e o rótulo OFERTA abre em dourado. params.files = [produto, oferta];
     params.items = [{kind: "produto"|"neq"|"oferta", t}], params.a / params.b = rótulos. -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --ease: cubic-bezier(.16, 1, .3, 1); --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; --onyx: #150C06; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: var(--onyx); }
.stage { display: block; perspective: 150vmin; }
.bg { position: absolute; inset: 0; background: radial-gradient(110% 60% at 50% 70%, #3a2716 0%, #150C06 70%);
      opacity: 0; animation: fade .5s ease-out forwards; }
.card { position: absolute; left: 50%; overflow: hidden; border-radius: 1.6vmin; background: center/cover no-repeat #222; }
.prod { top: 6%; width: 74%; aspect-ratio: 1.6; transform: translate(-50%, 6vmin); opacity: 0;
        filter: saturate(.35) brightness(.78) contrast(.95); box-shadow: 0 2vmin 5vmin rgba(0,0,0,.5);
        animation: rise .8s var(--tp) var(--ease) forwards, dim 1s var(--to) ease-out forwards; }
.lab { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; }
.lp { top: 36.6%; font-size: 4.6vmin; color: var(--sand); opacity: 0; animation: fade .6s calc(var(--tp) + .25s) ease-out forwards; }
.neq { position: absolute; left: 0; right: 0; top: 40.5%; text-align: center; font-weight: 600; font-size: 9vmin; color: var(--sand);
       opacity: 0; transform: scale(.7); filter: blur(.8vmin); animation: up .6s var(--tn) var(--ease) forwards; }
.ofer { top: 47%; width: 70%; aspect-ratio: 1.1; transform: translate(-50%, 14vmin) rotateX(24deg) scale(.92); opacity: 0;
        box-shadow: 0 3vmin 8vmin rgba(0,0,0,.6), 0 0 0 .3vmin rgba(224,187,106,.55);
        animation: land 1s var(--to) var(--ease) forwards; }
.lo { top: 83.5%; font-weight: 700; font-size: 10vmin; letter-spacing: .26em; padding-left: .26em;
      background: linear-gradient(180deg, #F3DDA6 0%, var(--gold) 55%, #B8924A 100%); -webkit-background-clip: text; color: transparent;
      clip-path: inset(0 100% 0 0); filter: drop-shadow(0 .6vmin 1.6vmin rgba(0,0,0,.6));
      animation: wipe .9s calc(var(--to) + .35s) var(--ease) forwards; }
.line { position: absolute; left: 50%; top: 82.4%; width: 50vmin; height: .25vmin; margin-left: -25vmin; transform: scaleX(0);
        background: linear-gradient(90deg, rgba(224,187,106,0), var(--gold) 30%, var(--gold) 70%, rgba(224,187,106,0));
        animation: open .9s calc(var(--to) + .2s) var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes dim { to { opacity: .55; transform: translate(-50%, 0) scale(.9); filter: saturate(.15) brightness(.6); } }
@keyframes land { to { opacity: 1; transform: translate(-50%, 0) rotateX(0deg) scale(1); } }
@keyframes up { to { opacity: 1; transform: none; filter: none; } }
@keyframes wipe { to { clip-path: inset(0 0 0 0); } }
@keyframes open { to { transform: scaleX(1); } }
@keyframes fade { to { opacity: 1; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit">
  <div class="bg"></div>
  <div class="card prod" id="p"></div><div class="lab lp" id="lp"></div>
  <div class="neq">≠</div>
  <div class="card ofer" id="o"></div><div class="line"></div><div class="lab lo" id="lo"></div>
</div>
<script>
const f = P.files || [], r = document.documentElement.style;
const it = k => (P.items || []).find(i => i.kind === k) || {};
const tp = +(it('produto').t ?? 0.2), tn = +(it('neq').t ?? tp + 1.2), to = +(it('oferta').t ?? tn + 0.8);
r.setProperty('--tp', tp.toFixed(2) + 's'); r.setProperty('--tn', tn.toFixed(2) + 's'); r.setProperty('--to', to.toFixed(2) + 's');
document.getElementById('p').style.backgroundImage = `url("${f[0] || ''}")`;
document.getElementById('o').style.backgroundImage = `url("${f[1] || ''}")`;
document.getElementById('lp').textContent = P.a || 'produto';
document.getElementById('lo').textContent = P.b || 'oferta';
</script></body></html>

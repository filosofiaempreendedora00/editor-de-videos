<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- APPS DE IA SURGINDO (V011: "qualquer LLM"): ícones de app (Claude, ChatGPT, Gemini…) surgem pequeninos ao redor
     da cabeça dele — nos lados e acima, NUNCA no rosto —, um depois do outro (cada um com o seu "pop" no plano),
     flutuam devagar por alguns segundos e somem encolhendo. Fundo transparente (ele continua na tela).
     params.files = [ícones], params.bg = [cor do azulejo de cada ícone], params.step (s entre um e outro). -->
<style>
:root { --ease: cubic-bezier(.34, 1.25, .64, 1); }
.stage { display: block; }
.app { position: absolute; width: 12.5vmin; height: 12.5vmin; border-radius: 2.9vmin; background: #fff center/64% no-repeat;
       box-shadow: 0 1.2vmin 3vmin rgba(0,0,0,.45), 0 0 0 .2vmin rgba(255,255,255,.35) inset; opacity: 0; will-change: transform; }
</style></head><body><script src="_base.js"></script>
<div class="stage" id="st"></div>
<script>
const files = P.files || [], bgs = P.bg || [];
// posições em volta da cabeça (x, y em % da tela): colunas laterais e um arco acima — o rosto fica livre
const POS = P.pos || [[13, 22], [84, 18], [10, 41], [88, 39], [27, 9], [70, 8], [16, 59], [83, 57]];
const step = +P.step || 0.32, dur = +P.dur || 3;
const st = document.getElementById('st');
files.forEach((f, k) => {
  const d = document.createElement('div'); d.className = 'app'; d.id = 'a' + k;
  d.style.backgroundImage = `url("${f}")`;
  if (bgs[k]) d.style.backgroundColor = bgs[k];
  const [x, y] = POS[k % POS.length];
  d.style.left = `calc(${x}% - 6.25vmin)`; d.style.top = `calc(${y}% - 6.25vmin)`;
  st.appendChild(d);
});
// surgir: escala 0 → 1 com um leve passar do ponto (o "pop") e assenta; sair: encolhe e some, na ordem inversa
const pop = x => { x = Math.max(0, Math.min(1, x)); const c = 1.55; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function paint(t) {
  files.forEach((f, k) => {
    const el = document.getElementById('a' + k);
    const t0 = 0.1 + k * step, tOut = dur - 0.45 - (files.length - 1 - k) * 0.06;
    const pin = pop((t - t0) / 0.42), pout = Math.max(0, Math.min(1, (t - tOut) / 0.35));
    const s = Math.max(0, pin * (1 - pout));
    const fx = Math.sin(t * 1.1 + k * 1.7) * 1.1, fy = Math.cos(t * 0.9 + k * 2.3) * 1.3, r = Math.sin(t * 0.8 + k) * 5;
    el.style.opacity = (t < t0 ? 0 : Math.min(1, (t - t0) / 0.12) * (1 - pout)).toFixed(3);
    el.style.transform = `translate(${fx.toFixed(2)}vmin, ${fy.toFixed(2)}vmin) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;
  });
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

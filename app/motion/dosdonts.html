<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- DOs × DON'Ts (V011: "aquilo que é uma boa prática numa edição… e tudo aquilo que não é"), editorial Kronos em tela
     cheia: duas colunas — "FAZ" (dourado, ✓) e "NÃO FAZ" (coral, ✕) — separadas por um fio; os pares entram linha a
     linha (o certo e, logo depois, o errado ao lado), cada item revelado por cortina saindo do desfoque; o ✕ risca
     com um traço fino e reto. params.rows = [[do, dont], …], params.t_do (quando a coluna FAZ começa) e
     params.t_dont (quando a NÃO FAZ começa), ou items kind "row" com t. -->
<style>
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: MA; src: url("../../fonts/MontserratAlternates-Bold.ttf"); font-weight: 700; }
:root { --ease: cubic-bezier(.16, 1, .3, 1); --gold: #E0BB6A; --cream: #F5EFE6; --sand: #A89070; --onyx: #150C06;
        --sepia: #2E2017; --coral: #F0916B; }
body { font-family: MA, "Helvetica Neue", sans-serif; background: var(--onyx); }
.stage { display: block; }
.glow { position: absolute; inset: 0; background: radial-gradient(95% 60% at 50% 34%, rgba(46,32,23,.95), rgba(21,12,6,1) 78%); }
.cols { position: absolute; left: 5%; right: 5%; top: 12%; display: grid; grid-template-columns: 1fr .3vmin 1fr; column-gap: 4vmin; }
.h { font-weight: 700; font-size: 5vmin; letter-spacing: .14em; white-space: nowrap; text-transform: uppercase; display: flex; align-items: center;
     gap: 1.6vmin; margin-bottom: 5.5vmin; opacity: 0; }
.h.do { color: var(--gold); } .h.dont { color: var(--coral); }
.h b { display: inline-grid; place-items: center; width: 7.4vmin; height: 7.4vmin; border-radius: 50%; font-size: 4.4vmin; }
.h.do b { border: .4vmin solid var(--gold); } .h.dont b { border: .4vmin solid var(--coral); }
.sep { grid-row: 1 / span 9; grid-column: 2; background: linear-gradient(180deg, rgba(168,144,112,0), rgba(168,144,112,.6) 15%, rgba(168,144,112,.6) 85%, rgba(168,144,112,0));
       transform-origin: top; transform: scaleY(0); }
.it { position: relative; color: var(--cream); font-weight: 600; font-size: 5.2vmin; line-height: 1.2; margin-bottom: 5.6vmin;
      opacity: 0; clip-path: inset(0 100% 0 0); filter: blur(.8vmin); min-height: 12.5vmin; }
.it.dont { color: rgba(245,239,230,.78); }
.it .st { position: absolute; left: 0; top: 3.2vmin; height: .3vmin; width: 100%; background: var(--coral); transform-origin: left;
          transform: scaleX(0); opacity: .85; }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="glow"></div>
  <div class="cols" id="cols">
    <div class="h do" id="hdo"><b>✓</b>faz</div><div class="sep" id="sep"></div><div class="h dont" id="hdont"><b>✕</b>não faz</div>
  </div>
</div>
<script>
const rows = P.rows || [['legenda longe do rosto', 'texto em cima dos olhos']];
const items = P.items || [];
const rT = items.filter(i => i.kind === 'row').map(i => +i.t);
const cols = document.getElementById('cols');
rows.forEach((r, k) => {
  cols.insertAdjacentHTML('beforeend', `<div class="it do" id="d${k}" style="grid-column:1">${esc(r[0])}</div>
    <div class="it dont" id="n${k}" style="grid-column:3">${esc(r[1])}<span class="st"></span></div>`);
});
const ease = x => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
const tRow = k => rT[k] ?? (0.55 + k * Math.max(0.9, ((+P.dur || 4) - 1.4) / rows.length));
function reveal(el, p) {
  el.style.opacity = Math.min(1, p * 1.4).toFixed(3);
  el.style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(1)}% 0 0)`;
  el.style.filter = p < 1 ? `blur(${((1 - p) * 0.8).toFixed(2)}vmin)` : 'none';
}
function paint(t) {
  const h = ease(t / 0.6);
  ['hdo', 'hdont'].forEach((id, j) => { const e = document.getElementById(id); const p = ease((t - j * 0.15) / 0.6);
    e.style.opacity = p.toFixed(3); e.style.transform = `translateY(${((1 - p) * 1.5).toFixed(2)}vmin)`; });
  document.getElementById('sep').style.transform = `scaleY(${h.toFixed(3)})`;
  rows.forEach((r, k) => {
    const t0 = tRow(k);
    reveal(document.getElementById('d' + k), ease((t - t0) / 0.7));
    const n = document.getElementById('n' + k), pn = ease((t - t0 - 0.45) / 0.7);
    reveal(n, pn);
    n.querySelector('.st').style.transform = `scaleX(${ease((t - t0 - 1.0) / 0.45).toFixed(3)})`;
  });
}
const seek0 = window.__seek;
window.__seek = t => { seek0(t); paint(t); };
paint(0);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.panel { width: min(80vw, 120vmin); padding: 4.5vmin 5vmin; border-radius: 3vmin;
         background: rgba(14,16,22,.82); backdrop-filter: blur(10px); border: .3vmin solid rgba(255,255,255,.12);
         box-shadow: 0 3vmin 8vmin rgba(0,0,0,.5); animation: panel .5s cubic-bezier(.2,1.3,.4,1) both; }
h1 { margin: 0 0 3vmin; font-size: 6.5vmin; text-transform: uppercase; color: var(--accent); animation: fade .4s .15s both; }
.item { display: flex; align-items: center; gap: 2.5vmin; font: 700 5.4vmin/1.2 "Helvetica Neue", Arial, sans-serif;
        margin: 2.2vmin 0; opacity: 0; animation: item .45s cubic-bezier(.2,1.4,.4,1) both; }
.n { flex: none; width: 7.5vmin; height: 7.5vmin; border-radius: 50%; display: grid; place-items: center;
     background: var(--accent); color: #111; font: 900 4.2vmin "Arial Black", sans-serif; }
@keyframes panel { from { transform: translateY(6vmin) scale(.92); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes item { from { transform: translateX(-6vmin); opacity: 0; } to { opacity: 1; transform: none; } }
</style></head><body><script src="_base.js"></script>
<div class="stage exit"><div class="panel"><h1 id="h"></h1><div id="l"></div></div></div>
<script>
const items = (P.items && P.items.length ? P.items : ['Primeiro ponto', 'Segundo ponto', 'Terceiro ponto']).slice(0, 5);
const h = document.getElementById('h'); if (P.title) h.textContent = P.title; else h.remove();
const gap = Math.min(.6, (+P.dur || 3) * .5 / items.length);
document.getElementById('l').innerHTML = items.map((it, i) =>
  `<div class="item" style="animation-delay:${(.35 + i * gap).toFixed(2)}s"><span class="n">${i + 1}</span><span>${esc(it)}</span></div>`).join('');
</script></body></html>
